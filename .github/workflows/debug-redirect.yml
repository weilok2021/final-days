# [DEBUG-rd01] Temporary: reproduce the redirect e2e failure on the runner.
name: debug-redirect

on:
  push:
    branches: [feature/fix-redirect-e2e]

permissions:
  contents: read

jobs:
  loop:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Redirect loop
        run: node scripts/debug-redirect-loop.ts 40
