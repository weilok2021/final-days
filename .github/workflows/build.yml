name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: windows/go.mod
      - name: Test (pure logic, runs on Linux)
        run: cd windows && go test ./...
      - name: Vet the Windows build
        run: cd windows && GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@v4
        with:
          name: final-days
          path: |
            dist/final-days.exe
            dist/SHA256SUMS

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: final-days
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/final-days.exe
            dist/SHA256SUMS
