name: build

on:
  push:
    branches: [main, dev]
    tags: ["v*"]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5.6.0
        with:
          go-version-file: windows/go.mod
      - name: Test (pure logic, runs on Linux)
        run: cd windows && go test ./...
      - name: Vet the Windows build
        run: cd windows && GOOS=windows GOARCH=amd64 go vet ./...
      - name: Build
        run: ./build.sh
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-days
          path: |
            dist/final-days.exe
            dist/SHA256SUMS

  extension:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: extension
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: extension/package-lock.json
      - run: npm ci
      - name: Type check
        run: npm run check
      - name: Test
        run: npm test
      - name: Build
        run: npm run build
      - name: Package the unpacked folder
        run: cd dist && zip -r ../../final-days-extension.zip .
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: final-days-extension
          path: final-days-extension.zip

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, extension]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: final-days
          path: dist
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: final-days-extension
          path: dist
      - name: Add the extension to the checksums
        run: cd dist && sha256sum final-days-extension.zip >> SHA256SUMS
      - uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          files: |
            dist/final-days.exe
            dist/final-days-extension.zip
            dist/SHA256SUMS
